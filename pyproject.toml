[project]
name = "amazon-opportunity-intelligence"
version = "0.2.0"
description = "Global Amazon Affiliate Opportunity Intelligence"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "streamlit",
    "pandas",
    "python-dotenv",
    "requests",
    "trendspy",
    "praw",
    "openai",
    "reportlab",
    "openpyxl",
    "xlsxwriter",
    "typer",
]

[project.scripts]
aoi = "aoi.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]