name: AOI Daily

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: aoi trends
      - run: aoi news
      - run: aoi report
      - uses: actions/upload-artifact@v4
        with:
          name: AOI-Reports
          path: reports/
