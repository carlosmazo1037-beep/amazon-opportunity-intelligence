name: AOI Daily
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: aoi trends
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: aoi report
      - uses: actions/upload-artifact@v4
        with:
          name: AOI-Reports
          path: reports/
