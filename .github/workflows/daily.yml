name: AOI Daily

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: aoi scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: aoi report
      - name: Commit results
        run: |
          git config user.name "AOI Bot"
          git config user.email "bot@aoi.local"
          git add reports/ database/ logs/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: daily scan [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: AOI-Reports
          path: reports/
